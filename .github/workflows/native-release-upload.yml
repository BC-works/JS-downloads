name: Upload verified native release files
on:
  push:
    branches: [release-staging]
    paths: [staging/manifest.json]
permissions:
  contents: write
jobs:
  windows:
    if: ${{ !github.event.deleted }}
    timeout-minutes: 12
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified installers
        run: python scripts/assemble-release.py
      - name: Install Playwright controller
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/pw" --ignore-scripts --no-audit --no-fund playwright@1.62.0
      - name: Upgrade released 3.6.4 and verify search, saved charts and Research Lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content 'staging/manifest.json' | ConvertFrom-Json
          $installerName = ($release.assets | Where-Object { $_.name -like 'Jyotish-Studio-Setup-*.exe' }).name
          $installer = (Resolve-Path (Join-Path 'staging/output' $installerName)).Path
          $baseline = Join-Path $env:RUNNER_TEMP 'Jyotish-Studio-Setup-3.6.4.exe'
          Invoke-WebRequest 'https://github.com/BC-works/JS-downloads/releases/download/v3.6.4/Jyotish-Studio-Setup-3.6.4.exe' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLower() -ne '3dfdce927188cce6250c3e1dafc507b7d8d95d29ca8e62ebd780ecea484e8604') { throw 'Baseline installer hash mismatch' }
          $profile = Join-Path $env:APPDATA 'Jyotish Studio Offline'
          New-Item -ItemType Directory -Force $profile | Out-Null
          Set-Content (Join-Path $profile 'installer-preservation-check.txt') 'retained'
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class NativeWindows {
            public delegate bool Callback(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, Callback cb, IntPtr p);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
          }
          '@
          function Dump-InstallerWindows {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Jyotish|uninstall|nsis|electron' } | Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Format-List
            Get-Process | Where-Object { $_.MainWindowTitle -and $_.ProcessName -match 'Jyotish|uninstall|nsis|electron' } | ForEach-Object {
              Write-Host ('WINDOW '+$_.Id+' '+$_.MainWindowTitle)
              [NativeWindows]::EnumChildWindows($_.MainWindowHandle, { param($h,$p) $text=New-Object Text.StringBuilder 4096; [void][NativeWindows]::GetWindowText($h,$text,4096); if($text.Length){Write-Host ('TEXT '+$text.ToString())}; return $true }, [IntPtr]::Zero) | Out-Null
            }
            Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter '*uninstall*.exe' -Recurse | Select-Object FullName,Length | Format-List
          }
          Write-Host 'Installing released 3.6.4 baseline'
          $first = Start-Process -FilePath $baseline -ArgumentList '/S' -PassThru
          if (-not $first.WaitForExit(180000)) { Dump-InstallerWindows; taskkill /PID $first.Id /T /F; throw 'First installer timed out' }
          Write-Host 'First installer finished'
          if ($first.ExitCode -ne 0) { throw "Installer exit code $($first.ExitCode)" }
          Get-Process JyotishStudio -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter JyotishStudio.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable was not found' }
          node scripts/windows-smoke.cjs $exe.FullName "$env:RUNNER_TEMP/pw/node_modules/playwright" baseline 3.6.4
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
          Write-Host 'Starting silent reinstall'
          $second = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
          if (-not $second.WaitForExit(180000)) { Dump-InstallerWindows; taskkill /PID $second.Id /T /F; throw 'Second installer timed out' }
          Write-Host 'Second installer finished'
          if ($second.ExitCode -ne 0) { throw "Reinstall exit code $($second.ExitCode)" }
          Get-Process JyotishStudio -ErrorAction SilentlyContinue | Stop-Process -Force
          node scripts/windows-smoke.cjs $exe.FullName "$env:RUNNER_TEMP/pw/node_modules/playwright" verify
          if ($LASTEXITCODE -ne 0) { throw 'Post-reinstall chart check failed' }
          node scripts/windows-smoke.cjs $exe.FullName "$env:RUNNER_TEMP/pw/node_modules/playwright" reopen
          if ($LASTEXITCODE -ne 0) { throw 'Research restart preservation failed' }
          if ((Get-Content (Join-Path $profile 'installer-preservation-check.txt')) -ne 'retained') { throw 'Profile was changed by installer' }
  upload:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify release files
        id: assemble
        run: python3 scripts/assemble-release.py
      - name: Attach files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.assemble.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" staging/output/* --repo "$GITHUB_REPOSITORY" --clobber
